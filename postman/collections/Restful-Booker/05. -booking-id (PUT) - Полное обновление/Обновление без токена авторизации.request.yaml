$kind: http-request
url: "{{baseUrl}}/booking/1"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "firstname": "{{updatedFirstname}}",
        "lastname": "{{updatedLastname}}"
    }
scripts:
  - type: afterResponse
    code: "pm.test(\"Статус ответа: 403 Forbidden\", function () {\r

      \    pm.expect(pm.response.code).to.equal(403);\r

      });\r

      \r

      pm.test(\"Присутствует сообщение об ошибке\", function () {\r

      \    const response = pm.response.text();\r

      \    pm.expect(response).to.include('Forbidden');\r

      });"
    language: text/javascript
order: 2000
