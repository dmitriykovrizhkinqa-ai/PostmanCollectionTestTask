$kind: http-request
name: Аутентификация со значением null в поле password
url: "{{baseUrl}}/auth"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "username": "{{adminUsername}}",
        "password": null
    }
scripts:
  - type: afterResponse
    code: "const response = pm.response.json();\r

      \r

      pm.test(\"Статус ответа: 400 Bad Request\", function () {\r

      \    pm.expect(pm.response.code).to.equal(400);\r

      });\r

      \r

      pm.test(\"Токен не должен быть создан\", function () {\r

      \    pm.expect(response).to.not.have.property('token');\r

      });\r

      \r

      pm.test(\"Присутствует сообщение об ошибке\", function () {\r

      \    pm.expect(response.reason || response.message).to.be.a('string');\r

      });"
    language: text/javascript
order: 4000
