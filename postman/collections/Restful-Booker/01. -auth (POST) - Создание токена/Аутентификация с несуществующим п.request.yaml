$kind: http-request
name: Аутентификация с несуществующим пользователем
url: "{{baseUrl}}/auth"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "username": "invalidUser",
        "password": "{{adminPassword}}"
    }
scripts:
  - type: afterResponse
    code: "const response = pm.response.json();\r

      \r

      pm.test(\"Статус ответа: 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"В ответе присутствует поле reason\", function () {\r

      \    pm.expect(response).to.have.property('reason');\r

      });\r

      \r

      pm.test(\"Токен не должен быть создан\", function () {\r

      \    pm.expect(response).to.not.have.property('token');\r

      });"
    language: text/javascript
order: 5000
