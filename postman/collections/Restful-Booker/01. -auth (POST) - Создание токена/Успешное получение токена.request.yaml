$kind: http-request
url: "{{baseUrl}}/auth"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "username": "{{adminUsername}}",
        "password": "{{adminPassword}}"
    }
order: 1000
scripts:
  - type: afterResponse
    code: |-
      const response = pm.response.json();

      pm.test("Статус ответа: 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Content-Type: application/json", function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test("Ответ является валидным JSON", function () {
          pm.expect(pm.response).to.have.jsonBody();
      });

      pm.test("В ответе присутствует поле token", function () {
          pm.expect(response).to.have.property('token');
      });

      pm.test("Токен является непустой строкой", function () {
          pm.expect(response.token).to.be.a('string');
          pm.expect(response.token).to.have.lengthOf.above(0);
      });

      pm.test("Токен не содержит пробелов", function () {
          pm.expect(response.token).to.not.include(' ');
      });

      pm.environment.set('token', response.token);
      pm.collectionVariables.set('token', response.token);
    language: text/javascript
