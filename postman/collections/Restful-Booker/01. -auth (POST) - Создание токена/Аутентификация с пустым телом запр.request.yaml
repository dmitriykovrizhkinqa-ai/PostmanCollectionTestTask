$kind: http-request
name: Аутентификация с пустым телом запроса
url: "{{baseUrl}}/auth"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Статус ответа: 400 Bad Request\", function () {\r

      \    pm.expect(pm.response.code).to.equal(400);\r

      });"
    language: text/javascript
order: 8000
