$kind: http-request
name: Аутентификация с пустой строкой в поле username
url: "{{baseUrl}}/auth"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "username": "",
        "password": "{{adminPassword}}"
    }
scripts:
  - type: afterResponse
    code: "const response = pm.response.json();\r

      \r

      pm.test(\"Статус ответа: 400 Bad Request\", function () {\r

      \    pm.expect(pm.response.code).to.equal(400);\r

      });\r

      \r

      pm.test(\"Токен не должен быть создан\", function () {\r

      \    pm.expect(response).to.not.have.property('token');\r

      });"
    language: text/javascript
order: 6000
