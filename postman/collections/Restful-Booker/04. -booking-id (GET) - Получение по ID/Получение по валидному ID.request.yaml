$kind: http-request
url: "{{baseUrl}}/booking/{{newBookingId}}}"
method: GET
scripts:
  - type: afterResponse
    code: "const response = pm.response.json();\r

      \r

      pm.test(\"Статус ответа: 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"В ответе присутствует firstname\", function () {\r

      \    pm.expect(response).to.have.property('firstname');\r

      });\r

      \r

      pm.test(\"В ответе присутствует lastname\", function () {\r

      \    pm.expect(response).to.have.property('lastname');\r

      });\r

      \r

      pm.test(\"В ответе присутствует totalprice\", function () {\r

      \    pm.expect(response).to.have.property('totalprice');\r

      });\r

      \r

      pm.test(\"В ответе присутствует depositpaid\", function () {\r

      \    pm.expect(response).to.have.property('depositpaid');\r

      });\r

      \r

      pm.test(\"В ответе присутствует bookingdates\", function () {\r

      \    pm.expect(response).to.have.property('bookingdates');\r

      });\r

      \r

      pm.test(\"firstname является строкой\", function () {\r

      \    pm.expect(response.firstname).to.be.a('string');\r

      });\r

      \r

      pm.test(\"lastname является строкой\", function () {\r

      \    pm.expect(response.lastname).to.be.a('string');\r

      });\r

      \r

      pm.test(\"totalprice является числом\", function () {\r

      \    pm.expect(response.totalprice).to.be.a('number');\r

      });\r

      \r

      pm.test(\"depositpaid является булевым\", function () {\r

      \    pm.expect(response.depositpaid).to.be.a('boolean');\r

      });\r

      \r

      pm.test(\"checkin имеет формат YYYY-MM-DD\", function () {\r

      \    pm.expect(response.bookingdates.checkin).to.match(/^\\d{4}-\\d{2}-\\d{2}$/);\r

      });\r

      \r

      pm.test(\"checkout имеет формат YYYY-MM-DD\", function () {\r

      \    pm.expect(response.bookingdates.checkout).to.match(/^\\d{4}-\\d{2}-\\d{2}$/);\r

      });"
    language: text/javascript
  - type: beforeRequest
    code: "const createNewBooking = {\r

      \    url: pm.environment.get(\"baseUrl\") + \"/booking\",\r

      \    method: \"POST\",                             \r

      \    header: {\r

      \        \"Content-Type\": \"application/json\"      \r

      \    },\r

      \    body: {\r

      \        mode: \"raw\",\r

      \        raw: JSON.stringify({                     \r

      \            \"firstname\": \"RandomJohn\",\r

      \            \"lastname\": \"RandomDoe\",\r

      \            \"totalprice\": 123421,\r

      \            \"depositpaid\": true,\r

      \            \"bookingdates\": {\r

      \                \"checkin\": \"2027-01-01\",\r

      \                \"checkout\": \"2028-01-10\"\r

      \    },\r

      \            \"additionalneeds\": \"RandomBreakfast\"\r

      \        })\r

      \    }\r

      };\r

      \r

      pm.sendRequest(createNewBooking, function (err, response) {\r

      \    var responseData = response.json();\r

      \    pm.environment.set(\"newBookingId\", responseData.bookingid);\r

      });\r\n"
    language: text/javascript
order: 1000
