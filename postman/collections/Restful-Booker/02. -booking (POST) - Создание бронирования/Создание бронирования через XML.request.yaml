$kind: http-request
url: "{{baseUrl}}/booking"
method: POST
headers:
  Content-Type: text/xml
  Accept: application/xml
body:
  type: xml
  content: |-
    <booking>
        <firstname>{{xmlFirstname}}</firstname>
        <lastname>{{xmlLastname}}</lastname>
        <totalprice>{{xmlTotalprice}}</totalprice>
        <depositpaid>true</depositpaid>
        <bookingdates>
            <checkin>{{xmlCheckin}}</checkin>
            <checkout>{{xmlCheckout}}</checkout>
        </bookingdates>
        <additionalneeds>{{xmlAdditionalneeds}}</additionalneeds>
    </booking>
scripts:
  - type: afterResponse
    code: "pm.test(\"Статус ответа: 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Ответ в формате XML\", function () {\r

      \    pm.expect(pm.response.headers.get('Content-Type')).to.include('text/html');\r

      });"
    language: text/javascript
order: 16000
