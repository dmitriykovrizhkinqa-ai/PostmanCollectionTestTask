$kind: http-request
url: "{{baseUrl}}/booking"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "firstname": "{{testFirstname}}",
        "lastname": "{{testLastname}}",
        "totalprice": {{testTotalprice}},
        "depositpaid": true,
        "bookingdates": {
            "checkin": "2026-12-05",
            "checkout": "2026-12-05"
        }
    }
scripts:
  - type: afterResponse
    code: "const response = pm.response.json();\r

      \r

      pm.test(\"Статус ответа: 200 OK\", function () {\r

      \    pm.expect(pm.response.code).to.equal(200);\r

      });\r

      \r

      pm.test(\"Дата checkin: 2026-12-05\", function () {\r

      \    pm.expect(response.booking.bookingdates.checkin).to.equal('2026-12-05');\r

      });\r

      \r

      pm.test(\"Дата checkout: 2026-12-05\", function () {\r

      \    pm.expect(response.booking.bookingdates.checkout).to.equal('2026-12-05');\r

      });"
    language: text/javascript
order: 15000
