$kind: http-request
url: "{{baseUrl}}/booking"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "firstname": "{{testFirstname}}",
        "lastname": "{{testLastname}}",
        "totalprice": {{testTotalprice}},
        "depositpaid": "yes",
        "bookingdates": {
            "checkin": "{{testCheckin}}",
            "checkout": "{{testCheckout}}"
        },
        "additionalneeds": "{{testAdditionalneeds}}"
    }
scripts:
  - type: afterResponse
    code: "pm.test(\"Статус ответа: 400 Bad Request\", function () {\r

      \    pm.expect(pm.response.code).to.equal(400);\r

      });\r

      \r

      pm.test(\"bookingid не должен быть создан\", function () {\r

      \    const response = pm.response.json();\r

      \    pm.expect(response).to.not.have.property('bookingid');\r

      });"
    language: text/javascript
order: 12000
