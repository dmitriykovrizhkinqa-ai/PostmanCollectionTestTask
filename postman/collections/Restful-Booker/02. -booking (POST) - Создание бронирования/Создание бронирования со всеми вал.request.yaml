$kind: http-request
name: Создание бронирования со всеми валидными полями
url: "{{baseUrl}}/booking"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "firstname": "{{testFirstname}}",
        "lastname": "{{testLastname}}",
        "totalprice": {{testTotalprice}},
        "depositpaid": true,
        "bookingdates": {
            "checkin": "{{testCheckin}}",
            "checkout": "{{testCheckout}}"
        },
        "additionalneeds": "{{testAdditionalneeds}}"
    }
scripts:
  - type: afterResponse
    code: "const response = pm.response.json();\r

      const expectedFirstname = pm.environment.get('testFirstname') || 'John';\r

      const expectedLastname = pm.environment.get('testLastname') || 'Doe';\r

      const expectedTotalprice = parseInt(pm.environment.get('testTotalprice') || '150');\r

      const expectedCheckin = pm.environment.get('testCheckin') || '2026-01-01';\r

      const expectedCheckout = pm.environment.get('testCheckout') || '2026-01-10';\r

      const expectedAdditionalneeds = pm.environment.get('testAdditionalneeds') || 'Breakfast';\r

      \r

      pm.test(\"Статус ответа: 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Content-Type: application/json\", function () {\r

      \    pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');\r

      });\r

      \r

      pm.test(\"В ответе присутствует bookingid\", function () {\r

      \    pm.expect(response).to.have.property('bookingid');\r

      });\r

      \r

      pm.test(\"bookingid является числом\", function () {\r

      \    pm.expect(response.bookingid).to.be.a('number');\r

      });\r

      \r

      pm.test(\"В ответе присутствует объект booking\", function () {\r

      \    pm.expect(response).to.have.property('booking');\r

      });\r

      \r

      const booking = response.booking;\r

      \r

      pm.test(\"Поле firstname: \" + expectedFirstname, function () {\r

      \    pm.expect(booking.firstname).to.equal(expectedFirstname);\r

      });\r

      \r

      pm.test(\"Поле lastname: \" + expectedLastname, function () {\r

      \    pm.expect(booking.lastname).to.equal(expectedLastname);\r

      });\r

      \r

      pm.test(\"Поле totalprice: \" + expectedTotalprice, function () {\r

      \    pm.expect(booking.totalprice).to.equal(expectedTotalprice);\r

      });\r

      \r

      pm.test(\"Поле depositpaid: true\", function () {\r

      \    pm.expect(booking.depositpaid).to.be.true;\r

      });\r

      \r

      pm.test(\"Присутствуют даты checkin и checkout\", function () {\r

      \    pm.expect(booking.bookingdates).to.have.property('checkin');\r

      \    pm.expect(booking.bookingdates).to.have.property('checkout');\r

      });\r

      \r

      pm.test(\"Дата checkin: \" + expectedCheckin, function () {\r

      \    pm.expect(booking.bookingdates.checkin).to.equal(expectedCheckin);\r

      });\r

      \r

      pm.test(\"Дата checkout: \" + expectedCheckout, function () {\r

      \    pm.expect(booking.bookingdates.checkout).to.equal(expectedCheckout);\r

      });\r

      \r

      pm.test(\"Поле additionalneeds: \" + expectedAdditionalneeds, function () {\r

      \    pm.expect(booking.additionalneeds).to.equal(expectedAdditionalneeds);\r

      });\r

      \r

      pm.environment.set('bookingId', response.bookingid);\r

      pm.collectionVariables.set('bookingId', response.bookingid);"
    language: text/javascript
order: 2000
